<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cronograma de Projetos e Tarefas · Desenvolvimento de Negócios · Cia de Talentos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400;1,9..144,600&family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --red:#EE222B; --red-soft:#FFE5E7; --green:#00A85C; --lime:#C4F000;
  --ink:#1D1D1B; --graph:#3D3D3D; --mute:#8A8A85; --line:#E5E5E0; --fog:#F5F4EF; --card:#fff;
  --crm:#004fce; --dados:#00A85C; --growth:#5c7a00; --auto:#ff6b1a; --agente:#2e22b8; --ops:#EE222B; --playbook:#e35fcf; --evento:#1d1d1b;
}
html{scroll-behavior:smooth;}
body{font-family:'Roboto',system-ui,sans-serif;background:var(--fog);color:var(--ink);-webkit-font-smoothing:antialiased;}
.topbar{position:sticky;top:0;z-index:60;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:10px 26px;}
.topbar img{height:38px;width:auto;}
.topbar .divider{width:1px;height:26px;background:var(--line);}
.topbar .app{font-weight:700;font-size:13px;}
.topbar .app small{display:block;font-size:9.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.08em;margin-top:1px;}
.topbar .spacer{flex:1;}
.topbar .date{font-size:11px;color:var(--mute);}
.hero{padding:26px 26px 8px;}
.eyebrow{display:flex;align-items:center;gap:9px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.14em;color:var(--red);}
.ast{display:inline-block;width:15px;height:15px;position:relative;}
.ast::before{content:'✳';color:var(--red);font-size:15px;line-height:1;}
.hero h1{font-family:'Fraunces',serif;font-style:italic;font-weight:600;font-size:34px;line-height:1.05;letter-spacing:-.5px;margin-top:8px;}
.hero p{font-size:13px;color:var(--graph);margin-top:8px;max-width:700px;}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;padding:16px 26px 6px;}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;position:relative;overflow:hidden;}
.kpi::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--ink);}
.kpi.k-prio::before{background:var(--red);} .kpi.k-run::before{background:var(--crm);} .kpi.k-hold::before{background:var(--auto);} .kpi.k-apoio::before{background:var(--playbook);} .kpi.k-fila::before{background:var(--mute);}
.kpi .n{font-family:'Fraunces',serif;font-size:27px;font-weight:600;line-height:1;}
.kpi .l{font-size:9.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;margin-top:6px;}
.toolbar{position:sticky;top:59px;z-index:40;background:rgba(245,244,239,.94);backdrop-filter:blur(6px);padding:12px 26px;display:flex;flex-direction:column;gap:9px;border-bottom:1px solid var(--line);}
.trow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.tlabel{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--mute);min-width:66px;}
.chip{font-size:11.5px;font-weight:500;border:1px solid var(--line);background:var(--card);border-radius:20px;padding:5px 12px;cursor:pointer;transition:.14s;color:var(--graph);}
.chip:hover{border-color:var(--mute);}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink);}
.chip.prio.on{background:var(--red);border-color:var(--red);}
.chip.apoio.on{background:var(--playbook);border-color:var(--playbook);}
.seg{display:inline-flex;background:#e9e7e0;border-radius:9px;padding:3px;gap:2px;margin-left:auto;}
.seg button{font-size:11.5px;font-weight:600;border:none;background:transparent;color:var(--mute);border-radius:6px;padding:6px 13px;cursor:pointer;}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08);}
.search{font-size:12px;padding:7px 12px;border:1px solid var(--line);border-radius:9px;background:var(--card);outline:none;min-width:180px;}
.search:focus{border-color:var(--ink);}
/* DATE BAR */
.datebar{display:none;align-items:center;gap:10px;flex-wrap:wrap;}
body.vdata .datebar{display:flex;}
body.vdata .trow:not(:first-child){display:none;}
body.vdata .trow:first-child>*:not(.seg):not(.datebar){display:none;}
.seg2{display:inline-flex;background:#e9e7e0;border-radius:9px;padding:3px;gap:2px;}
.seg2 button{font-size:11.5px;font-weight:700;border:none;background:transparent;color:var(--mute);border-radius:6px;padding:6px 15px;cursor:pointer;}
.seg2 button.on{background:var(--red);color:#fff;}
.dpick{font-size:12.5px;padding:6px 11px;border:1px solid var(--line);border-radius:9px;background:var(--card);outline:none;font-family:'Roboto';color:var(--ink);}
.dpick:focus{border-color:var(--ink);}
.dnav{font-size:14px;font-weight:700;border:1px solid var(--line);background:var(--card);border-radius:8px;width:30px;height:30px;cursor:pointer;color:var(--graph);}
.dnav:hover{border-color:var(--ink);}
.wrap{padding:16px 26px 60px;}
.count{font-size:12px;color:var(--mute);margin-bottom:12px;}
.count b{color:var(--ink);font-weight:700;}
/* DATE VIEW SUMMARY */
.dsum{background:var(--ink);color:#fff;border-radius:16px;padding:20px 24px;margin-bottom:18px;display:flex;align-items:center;gap:26px;flex-wrap:wrap;position:relative;overflow:hidden;}
.dsum::before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--red);}
.dsum .plabel{font-family:'Fraunces',serif;font-style:italic;font-size:20px;font-weight:600;text-transform:capitalize;}
.dsum .stat{display:flex;flex-direction:column;gap:1px;}
.dsum .stat .v{font-family:'Fraunces',serif;font-size:30px;font-weight:600;line-height:1;}
.dsum .stat .v small{font-size:14px;color:var(--mute);}
.dsum .stat .k{font-size:9.5px;color:#c9c9c6;text-transform:uppercase;letter-spacing:.06em;}
.dsum .hrs .v{color:var(--lime);}
.dsum .sp{flex:1;}
.dsum .hint{font-size:10.5px;color:#b9b9b5;max-width:190px;line-height:1.4;}
/* LISTA */
.sechead{font-family:'Fraunces',serif;font-size:19px;font-weight:600;margin:6px 0 14px;padding-bottom:6px;border-bottom:2px solid var(--red);display:flex;align-items:baseline;gap:10px;}
.sechead .sh-h{font-size:12px;color:var(--mute);font-weight:400;font-style:normal;font-family:'Roboto';}
.grp{margin-bottom:22px;}
.grp-h{display:flex;align-items:center;gap:10px;margin-bottom:9px;}
.grp-h .ic{width:24px;height:24px;border-radius:7px;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:11px;}
.grp-h h2{font-family:'Fraunces',serif;font-size:16px;font-weight:600;}
.grp-h .rule{flex:1;height:1px;background:var(--line);}
.grp-h .c{font-size:10px;color:var(--mute);font-family:'Roboto';}
.grp-h .ch{font-size:10px;color:var(--graph);font-family:'Roboto';font-weight:700;background:#eceae4;padding:2px 8px;border-radius:20px;}
.list{display:flex;flex-direction:column;gap:7px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:11px;display:flex;overflow:hidden;transition:.16s;}
.card:hover{box-shadow:0 4px 14px rgba(29,29,27,.07);transform:translateY(-1px);}
.card .accent{width:4px;flex-shrink:0;}
.card .body{flex:1;padding:11px 15px;display:flex;align-items:center;gap:14px;min-width:0;}
.card .lead{flex:1;min-width:0;}
.chips2{display:flex;gap:6px;margin-bottom:5px;flex-wrap:wrap;align-items:center;}
.tag{font-size:8.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:3px 7px;border-radius:5px;}
.tag-prio{background:var(--red);color:#fff;}
.tag-apoio{background:var(--red-soft);color:var(--red);}
.tag-cat{border:1px solid var(--line);color:var(--mute);}
.card h3{font-size:13.5px;font-weight:700;line-height:1.25;}
.card .obs{font-size:11px;color:var(--mute);margin-top:2px;}
.card .time{font-size:11.5px;color:var(--ink);font-weight:700;margin-top:3px;}
.card .time .occ{color:var(--red);}
.meta{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0;min-width:150px;}
.when{font-size:10.5px;color:var(--graph);font-weight:500;white-space:nowrap;}
.when .mono{font-family:'Roboto';color:var(--mute);}
.pill{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:4px 10px;border-radius:20px;white-space:nowrap;}
.p-run{background:#e7eeff;color:var(--crm);} .p-new{background:#eceae4;color:var(--graph);} .p-hold{background:#fff0e3;color:#c24e00;} .p-test{background:#ece9fb;color:var(--agente);} .p-fila{background:#eceae4;color:var(--mute);} .p-done{background:#daf3e7;color:#00854a;} .p-dem{background:#fdeaea;color:var(--red);}
.lead-i{display:none}
.people{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:9px}
.per{display:inline-flex;align-items:center;gap:6px;font:500 11px/1 Roboto,sans-serif;padding:3px 10px 3px 3px;border-radius:20px;border:1px solid var(--line);background:#fff;color:var(--ink);white-space:nowrap}
.per i{width:19px;height:19px;border-radius:50%;color:#fff;font:700 9px/1 Roboto,sans-serif;display:flex;align-items:center;justify-content:center;font-style:normal;flex:0 0 auto}
.per.lead{border-color:rgba(29,29,27,.5);box-shadow:0 1px 2px rgba(29,29,27,.06)}
.per.lead b{font:500 8px/1 Roboto,sans-serif;letter-spacing:.11em;text-transform:uppercase;color:var(--mute)}
.per.sup{background:var(--fog);color:var(--graph);border-color:transparent;font-weight:400}
.per.sup i{opacity:.85;width:17px;height:17px;font-size:8px}
.per.none{background:transparent;border-style:dashed;color:var(--mute);font-weight:400;padding-left:10px}
.emptyday{text-align:center;padding:38px;color:var(--mute);font-size:13px;background:var(--card);border:1px dashed var(--line);border-radius:12px;}
.autobar{margin-top:14px;padding:12px 15px;background:#faf9f6;border:1px solid var(--line);border-radius:11px;font-size:11.5px;color:var(--graph);}
.autobar b{color:var(--ink);}
.autobar .ac{display:inline-block;background:#eceae4;color:var(--graph);border-radius:20px;padding:2px 9px;margin:2px 3px;font-size:10.5px;}
/* GANTT */
.gscalebar{display:flex;align-items:center;gap:6px;margin-bottom:10px;font-size:11px;color:var(--mute);font-weight:600;}
.gsc{font-size:11px;border:1px solid var(--line);background:var(--card);border-radius:7px;padding:4px 11px;cursor:pointer;color:var(--graph);}
.gsc.on{background:var(--ink);color:#fff;border-color:var(--ink);}
.gantt-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card);}
.gantt{min-width:max-content;}
.grow{display:flex;border-bottom:1px solid var(--line);}
.grow:last-child{border-bottom:none;}
.grow.gh{position:sticky;top:0;background:var(--card);z-index:3;}
.glabel{width:228px;flex-shrink:0;position:sticky;left:0;background:var(--card);border-right:1px solid var(--line);padding:8px 12px;display:flex;flex-direction:column;gap:2px;justify-content:center;z-index:2;}
.glabel .gt{font-size:11px;font-weight:600;line-height:1.2;}
.glabel .gsub{font-size:8.5px;color:var(--mute);}
.grow.gh .glabel{font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);font-weight:700;}
.gtrack{position:relative;flex-shrink:0;min-height:36px;}
.grow.gh .gtrack{min-height:26px;height:26px;}
.ghcell{position:absolute;top:0;height:26px;font-size:9px;color:var(--mute);text-align:center;border-left:1px solid #efece5;padding-top:7px;overflow:hidden;white-space:nowrap;box-sizing:border-box;}
.ghcell.wk{border-left-color:#d8d5cd;}
.gbar{position:absolute;top:50%;transform:translateY(-50%);height:20px;border-radius:5px;display:flex;align-items:center;padding:0 7px;color:#fff;font-size:9px;font-weight:600;white-space:nowrap;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.12);}
.gbar.cont::after{content:'▶';margin-left:4px;font-size:7px;}
.gnodate{position:absolute;top:50%;left:8px;transform:translateY(-50%);font-size:9px;color:var(--mute);border:1px dashed var(--line);border-radius:5px;padding:2px 8px;background:var(--fog);white-space:nowrap;}
.gtoday{position:absolute;top:0;bottom:0;width:2px;background:var(--red);z-index:1;}
.gtoday::before{content:'HOJE';position:absolute;top:2px;left:3px;font-size:7px;color:var(--red);font-weight:700;}
.gmark{position:absolute;top:0;bottom:0;width:2px;background:var(--red);z-index:1;}
.gmark span{position:absolute;top:2px;left:3px;font-size:7px;color:var(--red);font-weight:700;white-space:nowrap;background:rgba(255,255,255,.75);padding:0 2px;border-radius:2px;}
.gferias{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(45deg,rgba(255,140,26,.12),rgba(255,140,26,.12) 6px,rgba(255,140,26,.04) 6px,rgba(255,140,26,.04) 12px);border-left:1px dashed #ff8c1a;border-right:1px dashed #ff8c1a;z-index:0;pointer-events:none;}
.gferiaslab{position:absolute;top:2px;font-size:8px;color:#c96a00;font-weight:700;background:#fff0e0;padding:1px 6px;border-radius:6px;white-space:nowrap;z-index:4;}
.feriasbanner{background:#fff0e0;border:1px solid #ffd9b0;border-left:4px solid #ff8c1a;border-radius:12px;padding:15px 20px;margin-bottom:16px;font-size:13.5px;color:#8a4b00;font-weight:600;}
.gstar{color:var(--red);}
.empty{text-align:center;padding:50px;color:var(--mute);font-size:13px;display:none;}
.foot{padding:16px 26px 40px;font-size:10px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em;}
@media(max-width:900px){.kpis{grid-template-columns:repeat(3,1fr);}.grow,.card .body{grid-template-columns:1fr;}.meta{align-items:flex-start;}.dsum{gap:16px;}}

/* ——— Gantt: barra de escala e janela ——— */
.gscalebar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:0 0 10px;font:500 11px/1 Roboto,sans-serif;color:var(--mute);letter-spacing:.04em;text-transform:uppercase}
.gscalebar .gsep{width:1px;height:16px;background:var(--line);margin:0 4px}
.gsc{font:500 11px/1 Roboto,sans-serif;padding:6px 11px;border:1px solid var(--line);background:#fff;color:var(--graph);border-radius:20px;cursor:pointer;transition:.15s;letter-spacing:0;text-transform:none}
.gsc:hover{border-color:var(--ink);color:var(--ink)}
.gsc.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.gwin{margin-left:auto;font:400 11px/1.5 'Roboto Mono',ui-monospace,monospace;color:var(--mute);text-transform:none;letter-spacing:0}
.gwin b{color:var(--red);font-weight:700}
.ghcell.yr{border-left:2px solid var(--graph)!important;font-weight:700;color:var(--ink)}
.ghcell.yr i{font-style:normal;opacity:.55;margin-left:1px}
.gnodatelist{margin-top:12px;padding:11px 14px;background:var(--fog);border-left:3px solid var(--mute);border-radius:0 8px 8px 0;font:400 12px/1.6 Roboto,sans-serif;color:var(--graph)}
.gnodatelist b{color:var(--ink)}
.gbar{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* ——— Marca CT: asterisco vermelho (assinatura) ——— */
.asterisk{display:inline-block;width:11px;height:11px;position:relative;vertical-align:middle;margin-right:7px}
.asterisk span,.asterisk::before,.asterisk::after{content:'';position:absolute;inset:0;margin:auto;width:11px;height:2px;background:var(--red);border-radius:1px}
.asterisk::before{transform:rotate(60deg)}
.asterisk::after{transform:rotate(-60deg)}
.tlabel{font-weight:500}

.selrow{gap:10px 14px;align-items:flex-end;flex-wrap:wrap}
.fl{display:flex;flex-direction:column;gap:4px}
.fl>span{font:500 9.5px/1 Roboto,sans-serif;letter-spacing:.13em;text-transform:uppercase;color:var(--mute)}
.sel{font:400 12.5px/1 Roboto,sans-serif;padding:8px 26px 8px 11px;border:1px solid var(--line);background:#fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M1 1l4 4 4-4' stroke='%238A8A85' stroke-width='1.6' fill='none' stroke-linecap='round'/></svg>") no-repeat right 9px center;color:var(--ink);border-radius:8px;cursor:pointer;appearance:none;-webkit-appearance:none;min-width:132px;transition:.15s}
.sel:hover{border-color:var(--graph)}
.sel:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px rgba(29,29,27,.07)}
.sel.act{border-color:var(--red);color:var(--red);font-weight:500;box-shadow:0 0 0 2px rgba(238,34,43,.09)}
.perlab{font:400 11.5px/1 'Roboto Mono',ui-monospace,monospace;color:var(--graph);background:var(--fog);padding:7px 11px;border-radius:7px;white-space:nowrap}
#datebar.off{opacity:.32;pointer-events:none}
/* Kanban */
.kb{display:flex;gap:13px;overflow-x:auto;padding-bottom:14px;align-items:flex-start}
.kcol{flex:0 0 290px;width:290px;background:var(--fog);border:1px solid var(--line);border-radius:13px;padding:11px}
.kch{display:flex;align-items:center;gap:8px;padding:2px 3px 10px}
.kch .kd{width:9px;height:9px;border-radius:3px;flex:0 0 auto}
.kch h3{font:700 12.5px/1.2 Roboto,sans-serif;letter-spacing:-.1px;color:var(--ink)}
.kch .kc{margin-left:auto;font:400 10.5px/1 'Roboto Mono',monospace;color:var(--graph);background:#fff;border:1px solid var(--line);padding:3px 8px;border-radius:20px}
.kcol .card{margin-bottom:8px}
.kcol .card:last-child{margin-bottom:0}
.kempty{font:400 11.5px/1.5 Roboto,sans-serif;color:var(--mute);text-align:center;padding:16px 8px}
</style>
</head>

function dateTaskCard(t,occ,min){

function renderDateView(){

    else{const last=new Date(y,mo+1,0).getDate();gw0=`${y}-${String(mo+1).padStart(2,'0')}-01`;gw1=`${y}-${String(mo+1).padStart(2,'0')}-${String(last).padStart(2,'0')}`;gsc='dia';}

function renderGantt(items){const pw=periodWindow();let a,b;

function isoD(d){return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);}
function periodWindow(){
  if(per==='todos')return null;
  const d=new Date(selDate+'T00:00:00');
  if(per==='dia'){const x=isoD(d);return [x,x];}
  if(per==='semana'){const m=new Date(d);m.setDate(m.getDate()-((m.getDay()+6)%7));const e=new Date(m);e.setDate(e.getDate()+6);return [isoD(m),isoD(e)];}
  if(per==='mes')return [isoD(new Date(d.getFullYear(),d.getMonth(),1)),isoD(new Date(d.getFullYear(),d.getMonth()+1,0))];
  return [isoD(new Date(d.getFullYear(),0,1)),isoD(new Date(d.getFullYear(),11,31))];

function inPeriod(p){
  const w=periodWindow(); if(!w)return true;
  if(p.tipo==='tarefa')return true;           // rotinas recorrem em qualquer recorte
  if(!p.s)return false;                        // projeto sem data não pertence a um recorte
  const e=p.e==='cont'?'2099-12-31':(p.e||p.s);

function periodLabel(){
